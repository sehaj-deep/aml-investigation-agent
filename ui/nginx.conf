server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # The copilot streams its steps; pass them through as they come.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths serve index.html so client routes work on reload.
    location / {
        try_files $uri /index.html;
    }
}
