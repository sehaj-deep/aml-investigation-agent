name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pre-commit (em dash and file checks)
        run: pre-commit run --all-files --hook-stage pre-commit
      # No dataset and no live LLM calls in CI: data and docker tests are excluded.
      - name: Tests
        run: python -m pytest -m "not data and not docker"
