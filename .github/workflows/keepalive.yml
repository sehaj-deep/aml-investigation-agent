# Keeps the public demo on Render's free tier awake: free services sleep after 15 minutes
# without traffic, and waking takes a minute or two. GitHub may delay scheduled runs a
# little; a 10-minute schedule leaves room for that.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the demo's health check
        run: |
          curl --fail --silent --show-error --max-time 180 --retry 3 --retry-delay 20 \
            https://aml-investigation-agent.onrender.com/api/health
