# nginx for the demo container: runs as a normal user, serves the UI on the Space's port
# and proxies /api to FastAPI. Every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 7860;
        root /app/ui;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            # The visitor's address, for the demo's per-visitor limits (stored only hashed).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # The copilot streams its steps.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
